[package]
name = "aud002-security-harness"
version = "0.0.0"
edition = "2024"
publish = false
description = "AUD-002 security harnesses for mhfe-core: isolation read-backs and input bounds"

# Not a member of the repository's workspace, which leaves docs/audits out.
[workspace]

[dependencies]
mhfe-core = { path = "../../../.." }
# The isolation probe's own system calls.
libc = "=0.2.191"

[[bin]]
name = "isolation-probe"
path = "src/isolation_probe.rs"

[[bin]]
name = "input-bounds"
path = "src/input_bounds.rs"

[lints.rust]
unsafe_code = "deny" # "deny", not "forbid": the isolation probe's libc calls allow it at the place

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny" # at 150 lines, CORE-15 (the repository's clippy.toml)
mod_module_files = "deny" # RUST-03
undocumented_unsafe_blocks = "deny" # RUST-07
