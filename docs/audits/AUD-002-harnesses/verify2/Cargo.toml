[package]
name = "aud002-verify2-tree-unchanged"
version = "0.0.0"
edition = "2024"
publish = false
description = "AUD-002 second verification round: the tree outside docs/audits is unchanged"

# Not part of any workspace: an audit harness is a crate of its own, with its own lockfile.
[workspace]

[dependencies]
# The SHA-256 of the working-tree diff; the version mhfe-core resolves to.
sha2 = { version = "=0.11.1", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny" # at 150 lines, CORE-15
mod_module_files = "deny" # RUST-03
undocumented_unsafe_blocks = "deny" # RUST-07
