# AUD-002 skeptic of the API finding on NFKD passphrase cost: built against mhfe-core by path, with
# the versions of its own Cargo.lock.
[package]
name = "aud002-skeptic-api-nfkd"
version = "0.0.0"
edition = "2024"
publish = false

# Not a member of the repository's workspace, which leaves docs/audits out.
[workspace]

[dependencies]
mhfe-core = { path = "../../../.." }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny" # at 150 lines, CORE-15 (the repository's clippy.toml)
mod_module_files = "deny" # RUST-03
undocumented_unsafe_blocks = "deny" # RUST-07
