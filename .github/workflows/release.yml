name: Release

# For a version tag: the fast checks on the tagged commit, then a draft release with the crate's
# package and its build-provenance attestation. vectors.yml replays the corpora at full cost for
# the same tag on its own; the maintainer signs the draft and publishes the crate only after both
# passed.
on:
  push:
    tags:
      - "v*"

# One release run per tag at a time, never cancelled half-way: a second push of the same tag
# waits. Cancel an outdated release run by hand.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  draft:
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      # For the build provenance (actions/attest), as in mhfe's release.yml: the workflow's OIDC
      # identity gets a short-lived Sigstore signing certificate, and GitHub stores the
      # attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      # The tag names the manifest's version, and the CHANGELOG has a section for it.
      - name: Check the tag and write the release notes
        run: |
          version="$(cargo pkgid --locked | sed 's/.*[#@]//')"
          test "$GITHUB_REF_NAME" = "v$version"
          awk -v version="$version" '/^## / { inside = ($2 == version); next } inside' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
      # Without the verifying build: no dependency's build script or macro runs in the job that may
      # sign provenance. The package is the same; CI's package job builds it for publication.
      - name: Package the crate
        run: |
          cargo package --locked --no-verify
          mkdir release
          cp target/package/*.crate release/
          (cd release && sha256sum -- *.crate > SHA256SUMS && cat SHA256SUMS)
      - name: Generate the build-provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "release/*.crate"
      # The signing key stays on the maintainer's computer: the release is published, and the
      # crate sent to crates.io, only after the package is checked and signed there.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --draft \
            --verify-tag \
            --title "mhfe-core $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
