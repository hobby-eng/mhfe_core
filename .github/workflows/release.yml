name: Release

# For a version tag: the fast checks and the fuzz targets on the tagged commit, then a draft
# release with the crate's package and its build-provenance attestation. vectors.yml replays the
# corpora at full cost for the same tag on its own; the maintainer signs the draft and publishes
# the crate only after both passed.
on:
  push:
    tags:
      - "v*"

# One release run per tag at a time, never cancelled half-way: a second push of the same tag
# waits. Cancel an outdated release run by hand.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  # Each fuzz target for 90 seconds under the sanitizer: a tag on which one finds a fault gets no
  # package.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-11-13 --profile minimal
          cargo +nightly-2026-11-13 install cargo-fuzz --locked --version 0.13.2
      - name: Run every fuzz target for 90 seconds
        run: |
          set -euo pipefail
          # The fuzz workspace's own lockfile, unchanged: cargo-fuzz has no --locked of its own.
          cargo +nightly-2026-11-13 fetch --locked --manifest-path fuzz/Cargo.toml
          targets=$(cargo +nightly-2026-11-13 fuzz list --fuzz-dir fuzz)
          test -n "$targets"
          for target in $targets; do
            cargo +nightly-2026-11-13 fuzz run --fuzz-dir fuzz --target x86_64-unknown-linux-gnu \
              "$target" -- -max_total_time=90 -rss_limit_mb=3000 -max_len=4096
          done
          # cargo-fuzz could have resolved anew: the results count only for the checked-in graph.
          git diff --exit-code -- fuzz/Cargo.lock
      - name: Keep the inputs of a fault
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Reads the repository and runs its tools with read access only, and hands the package and its
  # notes on as artifacts: no code of the repository runs beside a right to sign or to write.
  package:
    needs: [checks, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      # The tag names the manifest's version, and the CHANGELOG has a section for it.
      - name: Check the tag and write the release notes
        run: |
          version="$(cargo pkgid --locked | sed 's/.*[#@]//')"
          test "$GITHUB_REF_NAME" = "v$version"
          mkdir notes
          awk -v version="$version" '/^## / { inside = ($2 == version); next } inside' \
            CHANGELOG.md > notes/notes.md
          test -s notes/notes.md
      - name: Package the crate and verify its build
        run: |
          cargo package --locked
          mkdir release
          cp target/package/*.crate release/
          (cd release && sha256sum -- *.crate > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/
          if-no-files-found: error

  attest:
    needs: [package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # For the build provenance (actions/attest), as in mhfe's release.yml: the workflow's OIDC
      # identity gets a short-lived Sigstore signing certificate, and GitHub stores the
      # attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release
      - name: Generate the build-provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "release/*.crate"

  # The signing key stays on the maintainer's computer: the release is published, and the crate
  # sent to crates.io, only after the package is checked and signed there.
  draft:
    needs: [attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --draft \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --title "mhfe-core $GITHUB_REF_NAME" \
            --notes-file notes/notes.md
